<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watching Eyes</title>
<style>
  :root{
    --void:#050304;
    --ember:#ff6a00;
    --ui-bg:rgba(20,12,10,.88);
    --ui-fg:#f3e6d8;
    --ui-dim:#a08f80;
  }
  html,body{margin:0;height:100%;background:var(--void);overflow:hidden;color:var(--ui-fg);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
  canvas{display:block;width:100vw;height:100vh}
  video{display:none}
  .panel{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    width:min(420px,calc(100vw - 32px));background:var(--ui-bg);border:1px solid #3a2620;border-radius:14px;
    padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
  .panel h1{margin:0;font-size:18px;letter-spacing:.02em}
  .panel p{margin:0;color:var(--ui-dim);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{font:inherit;border:1px solid #5a3a2c;background:#2a1712;color:var(--ui-fg);
    padding:10px 14px;border-radius:10px;cursor:pointer}
  button.on{background:var(--ember);color:#1a0b04;border-color:var(--ember);font-weight:600}
  button.go{background:var(--ember);color:#1a0b04;border-color:var(--ember);font-weight:700;width:100%;font-size:17px;padding:14px}
  label{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ui-dim);width:100%}
  input[type=range]{flex:1;accent-color:var(--ember)}
  .err{color:#ff8a7a;font-size:13px}
  [hidden]{display:none!important}
  #dbg{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;width:96px;height:72px;
    border:1px solid #444;image-rendering:pixelated;opacity:.8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>
<canvas id="dbg" hidden></canvas>

<div class="panel" id="panel">
  <h1>Watching Eyes</h1>
  <p>Front camera tracks movement. Nothing is recorded or sent anywhere. Tap the screen anytime to bring this panel back.</p>
  <div class="row" id="styles">
    <button data-s="inferno" class="on">Inferno</button>
    <button data-s="eyes">Eyes</button>
  </div>
  <div class="row">
    <button id="sndBtn" class="on">Fire sound: on</button>
  </div>
  <label>Volume <input id="vol" type="range" min="0" max="10" value="9"></label>
  <label>Sensitivity <input id="sens" type="range" min="1" max="10" value="6"></label>
  <div class="row">
    <button id="flip">Flip left/right</button>
    <button id="flipV">Flip top/bottom</button>
    <button id="dbgBtn">Camera view</button>
    <button id="camBtn">Switch camera</button>
  </div>
  <p id="status">Status: starting…</p>
  <button class="go" id="go">Start</button>
  <div class="err" id="err" hidden></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const video = $('v');
  const panel = $('panel'), errEl = $('err'), statusEl = $('status');
  const sensEl = $('sens'), volEl = $('vol');
  const dbg = $('dbg'), dctx = dbg.getContext('2d');

  let style = 'inferno';
  let flip = false, flipV = false, showDbg = false, running = false, soundOn = true;

  function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', resize); resize();

  document.querySelectorAll('#styles button').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const next = b.dataset.s;
    if (next !== style) {
      STYLES[style].deactivate?.();
      style = next;
      STYLES[style].activate?.();
    }
    document.querySelectorAll('#styles button').forEach(x => x.classList.toggle('on', x === b));
  });

  function toggle(id, apply) {
    $(id).onclick = e => { e.stopPropagation(); e.target.classList.toggle('on', apply()); };
  }
  toggle('flip',   () => (flip = !flip));
  toggle('flipV',  () => (flipV = !flipV));
  toggle('dbgBtn', () => { showDbg = !showDbg; dbg.hidden = !showDbg; return showDbg; });

  $('sndBtn').onclick = e => {
    e.stopPropagation();
    soundOn = !soundOn;
    e.target.classList.toggle('on', soundOn);
    e.target.textContent = 'Fire sound: ' + (soundOn ? 'on' : 'off');
    if (soundOn) FireSound.start();
  };

  $('go').onclick = async e => {
    e.stopPropagation();
    if (!running) await Camera.start();
    if (soundOn) FireSound.start();
    if (running) {
      panel.hidden = true;
      try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (_) {}
      try { await navigator.wakeLock.request('screen'); } catch (_) {}
    }
  };

  panel.addEventListener('click', e => e.stopPropagation());
  cv.addEventListener('click', () => { panel.hidden = !panel.hidden; });

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && running) { try { await navigator.wakeLock.request('screen'); } catch (_) {} }
  });

  const Camera = (() => {
    let cams = [], camIdx = -1, stream = null;
    const LOW_RES = { width: { ideal: 320 }, height: { ideal: 240 } };

    function status(m) { statusEl.textContent = 'Status: ' + m; }
    function showErr(m) { errEl.textContent = m; errEl.hidden = false; status('camera not running'); }

    async function open(constraints) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({ video: constraints, audio: false });
      video.srcObject = stream;
      await video.play();
      Motion.reset();
      const tr = stream.getVideoTracks()[0], st = tr.getSettings();
      status('camera ON: ' + (tr.label || 'unnamed') + ' (' + (st.width || '?') + 'x' + (st.height || '?') + ')');
    }

    async function start() {
      errEl.hidden = true;
      status('secure page: ' + (window.isSecureContext ? 'yes' : 'NO') + ', address: ' + location.protocol + '//' + (location.host || '(local file)'));
      if (!window.isSecureContext || !navigator.mediaDevices || /^(content|file):$/.test(location.protocol)) {
        showErr('Chrome will not ask for the camera on this address. It must start with https://.'); return;
      }
      try {
        const st = await navigator.permissions.query({ name: 'camera' });
        if (st.state === 'denied') {
          showErr('Camera blocked. Grant permission in browser settings.'); return;
        }
      } catch (_) {}
      try {
        try { await open({ facingMode: 'user', ...LOW_RES }); }
        catch (e) {
          if (e.name === 'NotAllowedError' || e.name === 'SecurityError') throw e;
          await open(true);
        }
        running = true;
        try {
          cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
          const cur = stream.getVideoTracks()[0].getSettings().deviceId;
          camIdx = Math.max(0, cams.findIndex(c => c.deviceId === cur));
        } catch (_) {}
      } catch (e) {
        showErr('Camera error: ' + (e.name || e.message));
      }
    }

    async function next() {
      if (!running) { await start(); return; }
      if (cams.length < 2) return;
      camIdx = (camIdx + 1) % cams.length;
      try { await open({ deviceId: { exact: cams[camIdx].deviceId }, ...LOW_RES }); } catch (_) {}
    }

    return { start, next };
  })();

  $('camBtn').onclick = e => { e.stopPropagation(); Camera.next(); };

  const Motion = (() => {
    const W = 64, H = 48;
    const work = document.createElement('canvas'); work.width = W; work.height = H;
    const wctx = work.getContext('2d', { willReadFrequently: true });
    dbg.width = W; dbg.height = H;

    let prev = null;
    const target = { x: 0, y: 0 };
    let lastSeen = 0;

    function sample() {
      if (!running || video.readyState < 2) return;
      wctx.drawImage(video, 0, 0, W, H);
      const d = wctx.getImageData(0, 0, W, H).data;
      const g = new Uint8ClampedArray(W * H);
      for (let i = 0, j = 0; j < g.length; i += 4, j++) g[j] = (d[i] * 3 + d[i + 1] * 4 + d[i + 2]) >> 3;

      if (prev) {
        const thr = 52 - sensEl.value * 4;
        let sx = 0, sy = 0, n = 0;
        const out = showDbg ? dctx.createImageData(W, H) : null;

        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
          const k = y * W + x, diff = Math.abs(g[k] - prev[k]);
          if (diff > thr) { sx += x; sy += y; n++; }
          if (out) {
            const o = k * 4, gray = g[k] >> 1;
            out.data[o] = diff > thr ? 255 : gray; out.data[o + 1] = gray; out.data[o + 2] = gray; out.data[o + 3] = 255;
          }
        }
        if (out) dctx.putImageData(out, 0, 0);

        if (n > 6 && (n / (W * H)) < 0.6) {
          let nx = (sx / n) / W * 2 - 1, ny = (sy / n) / H * 2 - 1;
          nx = -nx;
          if (flip) nx = -nx;
          if (flipV) ny = -ny;
          target.x += (nx - target.x) * 0.35;
          target.y += (ny - target.y) * 0.35;
          lastSeen = performance.now();
        }
      }
      prev = g;
    }

    return { sample, target, reset: () => { prev = null; }, lastSeen: () => lastSeen };
  })();

  const Gaze = (() => {
    const look = { x: 0, y: 0 };
    let idleUntil = 0, idleGoal = { x: 0, y: 0 };
    let blink = 0, nextBlink = performance.now() + 2500;
    let pupil = 1;

    function update(t) {
      const tracking = t - Motion.lastSeen() < 1800;
      let gx, gy;
      if (tracking) {
        gx = Motion.target.x; gy = Motion.target.y;
        pupil += (0.55 - pupil) * .1;
      } else {
        if (t > idleUntil) {
          idleGoal = { x: (Math.random() * 2 - 1) * .8, y: (Math.random() * 2 - 1) * .5 };
          idleUntil = t + 1200 + Math.random() * 2500;
        }
        gx = idleGoal.x; gy = idleGoal.y;
        pupil += (1 - pupil) * .05;
      }
      const k = tracking ? .18 : .06;
      look.x += (gx - look.x) * k; look.y += (gy - look.y) * k;

      if (t > nextBlink) { blink = 1; nextBlink = t + 2500 + Math.random() * 4500; }
      const lid = blink > 0 ? Math.sin(blink * Math.PI) : 0;
      if (blink > 0) blink = Math.max(0, blink - .08);

      return { t, w: cv.width, h: cv.height, look, lid, pupil, tracking, intensity: tracking ? 1 : 0.35 };
    }
    return { update };
  })();

  function classicEye(cx, cy, r, s, irisCol) {
    const { look, lid, pupil } = s;
    const sg = ctx.createRadialGradient(cx - r * .2, cy - r * .3, r * .1, cx, cy, r);
    sg.addColorStop(0, '#fff8ee'); sg.addColorStop(.75, '#e8d6c4'); sg.addColorStop(1, '#9c6a5a');
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = sg; ctx.fill(); ctx.clip();

    // Bloodshot veins
    ctx.strokeStyle = 'rgba(170,20,20,.45)'; ctx.lineWidth = r * .012;
    for (let i = 0; i < 9; i++) {
      const a = i * 0.7 + cx * 0.001;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      ctx.quadraticCurveTo(cx + Math.cos(a + .3) * r * .75, cy + Math.sin(a + .3) * r * .75,
                           cx + Math.cos(a - .1) * r * .55, cy + Math.sin(a - .1) * r * .55);
      ctx.stroke();
    }

    // Iris & Pupil
    const ix = cx + look.x * r * .45, iy = cy + look.y * r * .4, ir = r * .45;
    ctx.shadowColor = irisCol; ctx.shadowBlur = r * .5;
    const ig = ctx.createRadialGradient(ix, iy, ir * .2, ix, iy, ir);
    ig.addColorStop(0, '#ffe08a'); ig.addColorStop(.5, irisCol); ig.addColorStop(1, '#2a0800');
    ctx.beginPath(); ctx.arc(ix, iy, ir, 0, Math.PI * 2); ctx.fillStyle = ig; ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(ix, iy, ir * .16 * pupil, ir * .8, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.arc(ix - ir * .35, iy - ir * .4, ir * .14, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  const EyesStyle = {
    draw(s) {
      const { w, h, lid } = s;
      const r = Math.min(w * .21, h * .38), gap = r * 1.25;
      const lx = w / 2 - gap, rx = w / 2 + gap, cy = h / 2;

      // Draw standard eyeballs
      classicEye(lx, cy, r, s, '#e2541a');
      classicEye(rx, cy, r, s, '#e2541a');

      // ANGRY OVERLAY: One continuous curved mask over both eyes
      ctx.save();
      ctx.fillStyle = '#050304';

      // Curved Brow (Large arc sweeping down between eyes)
      ctx.beginPath();
      ctx.moveTo(lx - r - 20, cy - r - 20);
      ctx.lineTo(rx + r + 20, cy - r - 20);
      ctx.lineTo(rx + r + 20, cy - r * 0.15);
      ctx.quadraticCurveTo(w / 2, cy + r * 0.55, lx - r - 20, cy - r * 0.15);
      ctx.closePath();
      ctx.fill();

      // Lower Lids (Curved upward squints)
      ctx.beginPath();
      ctx.arc(lx, cy + r * 1.35, r * 0.85, Math.PI * 1.15, Math.PI * 1.85);
      ctx.lineTo(lx + r + 10, cy + r + 10);
      ctx.lineTo(lx - r - 10, cy + r + 10);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(rx, cy + r * 1.35, r * 0.85, Math.PI * 1.15, Math.PI * 1.85);
      ctx.lineTo(rx + r + 10, cy + r + 10);
      ctx.lineTo(rx - r - 10, cy + r + 10);
      ctx.closePath();
      ctx.fill();

      // Dynamic Blinking Overlay
      if (lid > 0) {
        const bar = (r * 2 + 10) * lid / 2;
        ctx.fillRect(lx - r - 10, cy - r - 10, r * 2 + 20, bar + r * 0.4);
        ctx.fillRect(lx - r - 10, cy + r + 10 - bar - r * 0.4, r * 2 + 20, bar + r * 0.4);
        ctx.fillRect(rx - r - 10, cy - r - 10, r * 2 + 20, bar + r * 0.4);
        ctx.fillRect(rx - r - 10, cy + r + 10 - bar - r * 0.4, r * 2 + 20, bar + r * 0.4);
      }

      ctx.restore();
    }
  };

  const Storm = (() => {
    function cloudShape(seed) {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d');
      let rnd = seed;
      const r = () => { rnd = (rnd * 16807) % 2147483647; return rnd / 2147483647; };
      for (let i = 0; i < 26; i++) {
        const x = 128 + (r() - .5) * 150, y = 128 + (r() - .5) * 90, rad = 30 + r() * 55;
        const gr = g.createRadialGradient(x, y, 0, x, y, rad), shade = 6 + r() * 14;
        gr.addColorStop(0, `rgba(${shade + 8},${shade + 2},${shade},.75)`);
        gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
      }
      g.globalCompositeOperation = 'source-atop';
      const lit = g.createLinearGradient(0, 90, 0, 230);
      lit.addColorStop(0, 'rgba(0,0,0,0)'); lit.addColorStop(1, 'rgba(255,90,20,.35)');
      g.fillStyle = lit; g.fillRect(0, 0, 256, 256);
      return c;
    }
    const shapes = [11, 97, 403, 1201, 5003].map(cloudShape);
    const COUNT = 16;
    let clouds = [], flash = 0, nextFlash = performance.now() + 4000;

    function draw(s) {
      const { w, h, t, intensity } = s, D = Math.max(w, h);

      const sky = ctx.createRadialGradient(w / 2, h * .55, 0, w / 2, h * .55, D * .8);
      sky.addColorStop(0, '#5a1d05'); sky.addColorStop(.45, '#2b0c03'); sky.addColorStop(1, '#080201');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);

      const first = clouds.length === 0;
      while (clouds.length < COUNT) {
        clouds.push({
          a: Math.random() * Math.PI * 2,
          d: 0.02 + Math.random() * .1,
          z: first ? 0.05 + Math.random() * 1.1 : 0.05 + Math.random() * .1,
          spr: (Math.random() * shapes.length) | 0,
          rot: (Math.random() - .5) * .6,
          spd: 0.0016 + Math.random() * .0016
        });
      }

      for (let i = clouds.length - 1; i >= 0; i--) {
        const c = clouds[i];
        c.z += c.spd * (1 + c.z * 2);
        c.d += c.spd * 0.9;
        if (c.z > 1.35) clouds.splice(i, 1);
      }

      clouds.sort((p, q) => p.z - q.z);
      for (const c of clouds) {
        const size = D * (0.12 + c.z * .75);
        const x = w / 2 + Math.cos(c.a) * c.d * D * (0.3 + c.z);
        const y = h * .5 + Math.sin(c.a) * c.d * D * (0.22 + c.z * .7);
        const fadeIn = Math.min(1, c.z * 6), fadeOut = c.z > 1 ? Math.max(0, 1 - (c.z - 1) / .35) : 1;
        ctx.save(); ctx.globalAlpha = fadeIn * fadeOut;
        ctx.translate(x, y); ctx.rotate(c.rot + t * 0.00003);
        ctx.drawImage(shapes[c.spr], -size / 2, -size / 2 * .7, size, size * .7);
        ctx.restore();
      }

      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const glow = ctx.createRadialGradient(w / 2, h * .56, 0, w / 2, h * .56, D * .55);
      glow.addColorStop(0, `rgba(255,90,10,${.18 + .14 * intensity})`); glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);

      if (t > nextFlash) { flash = 1; nextFlash = t + 3500 + Math.random() * 9000; }
      if (flash > 0) {
        ctx.fillStyle = `rgba(255,170,120,${flash * .22})`; ctx.fillRect(0, 0, w, h);
        flash = Math.max(0, flash - (.06 + Math.random() * .06));
      }
      ctx.restore();
    }

    return { draw, clear: () => { clouds = []; } };
  })();

  const Fire = (() => {
    function glowDot(inner, mid) {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, inner); gr.addColorStop(.4, mid); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
    }
    const stages = [
      glowDot('rgba(255,250,210,.6)', 'rgba(255,200,70,.4)'),
      glowDot('rgba(255,180,50,.65)', 'rgba(255,100,10,.4)'),
      glowDot('rgba(255,90,10,.6)',  'rgba(190,30,0,.35)'),
      glowDot('rgba(160,30,0,.65)',  'rgba(60,10,0,.3)')
    ];
    let parts = [];

    function spawn(ix, iy, ir, r, rate, intensity) {
      for (let i = 0; i < rate && parts.length < 1600; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = r * (0.005 + Math.random() * 0.01) * (0.8 + intensity);
        parts.push({
          x: ix + Math.cos(a) * ir * .8, y: iy + Math.sin(a) * ir * .5,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - r * 0.003,
          life: 0, max: 30 + Math.random() * 35,
          size: ir * (0.2 + Math.random() * 0.25),
          wob: Math.random() * 6
        });
      }
    }

    function draw(r) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        if (++p.life > p.max) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
        const f = p.life / p.max;
        p.vy -= r * 0.0004;
        p.vx += Math.sin(p.life * 0.25 + p.wob) * r * 0.0005;
        p.vx *= 0.985; p.x += p.vx; p.y += p.vy;
        const s = p.size * (1 - f * 0.5);
        ctx.globalAlpha = 1 - f * f;
        ctx.drawImage(stages[Math.min(3, (f * 4) | 0)], p.x - s, p.y - s, s * 2, s * 2);
      }
      ctx.restore(); ctx.globalAlpha = 1;
    }

    return { spawn, draw, clear: () => { parts = []; } };
  })();

  const FireSound = (() => {
    let audio = null, level = 0;
    function noise(ac, seconds, brown) {
      const len = ac.sampleRate * seconds, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const wv = Math.random() * 2 - 1;
        if (brown) { last = (last + 0.02 * wv) / 1.02; d[i] = last * 3.5; } else d[i] = wv;
      }
      return buf;
    }

    function start() {
      if (audio) { audio.ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 4; comp.knee.value = 10;
      const master = ac.createGain(); master.gain.value = 0;
      master.connect(comp); comp.connect(ac.destination);

      const roarSrc = ac.createBufferSource(); roarSrc.buffer = noise(ac, 4, true); roarSrc.loop = true;
      const roarLP = ac.createBiquadFilter(); roarLP.type = 'lowpass'; roarLP.frequency.value = 520; roarLP.Q.value = 0.7;
      const roarGain = ac.createGain(); roarGain.gain.value = 1.6;
      roarSrc.connect(roarLP); roarLP.connect(roarGain); roarGain.connect(master);

      const hissSrc = ac.createBufferSource(); hissSrc.buffer = noise(ac, 3, false); hissSrc.loop = true;
      const hissBP = ac.createBiquadFilter(); hissBP.type = 'bandpass'; hissBP.frequency.value = 1800; hissBP.Q.value = 0.6;
      const hissGain = ac.createGain(); hissGain.gain.value = 0.12;
      hissSrc.connect(hissBP); hissBP.connect(hissGain); hissGain.connect(master);

      roarSrc.start(); hissSrc.start();
      audio = { ac, master, roarLP };
    }

    function setVolume(v, intensity) {
      if (!audio || !soundOn) return;
      level = (v / 10) * (0.45 + 0.55 * intensity);
      audio.master.gain.setTargetAtTime(level * 0.5, audio.ac.currentTime, 0.08);
      audio.roarLP.frequency.setTargetAtTime(320 + level * 380, audio.ac.currentTime, 0.1);
    }

    function stop() { if (audio) audio.master.gain.setTargetAtTime(0, audio.ac.currentTime, 0.08); }

    return { start, setVolume, stop };
  })();

  const InfernoStyle = {
    draw(s) {
      const { w, h, t, look, lid, pupil, intensity } = s;
      const cx = w / 2, cy = h / 2 - h * 0.02;
      const rx = Math.min(w * 0.38, h * 0.55);
      const ry = rx * 0.62;

      // 1. Draw Storm Background
      Storm.draw(s);

      // 2. Barad-dûr Fortress Tower Base & Main Horns
      ctx.save();
      const hornGrad = ctx.createLinearGradient(0, cy - ry * 2, 0, cy + ry * 2.2);
      hornGrad.addColorStop(0, '#28130d');
      hornGrad.addColorStop(0.35, '#ff8030');
      hornGrad.addColorStop(0.7, '#1e0c08');
      hornGrad.addColorStop(1, '#090302');

      ctx.fillStyle = hornGrad;
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = rx * 0.018;

      ctx.beginPath();
      ctx.moveTo(cx - rx * 1.35, h);
      ctx.quadraticCurveTo(cx - rx * 1.3, cy + ry * 1.5, cx - rx * 1.28, cy + ry * 1.1);
      ctx.lineTo(cx - rx * 1.25, cy + ry * 1.3);
      ctx.quadraticCurveTo(cx - rx * 1.05, cy - ry * 0.8, cx - rx * 1.1, cy - ry * 2.2);
      ctx.quadraticCurveTo(cx - rx * 0.85, cy + ry * 0.4, cx - rx * 0.2, cy + ry * 1.15);

      ctx.lineTo(cx, cy + ry * 0.3);
      ctx.lineTo(cx + rx * 0.2, cy + ry * 1.15);

      ctx.quadraticCurveTo(cx + rx * 0.85, cy + ry * 0.4, cx + rx * 1.1, cy - ry * 2.2);
      ctx.quadraticCurveTo(cx + rx * 1.05, cy - ry * 0.8, cx + rx * 1.25, cy + ry * 1.3);
      ctx.lineTo(cx + rx * 1.28, cy + ry * 1.1);
      ctx.quadraticCurveTo(cx + rx * 1.3, cy + ry * 1.5, cx + rx * 1.35, h);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      ctx.strokeStyle = 'rgba(10,3,1,0.7)';
      ctx.lineWidth = rx * 0.012;
      for (let i = 1; i <= 9; i++) {
        const factor = i / 10;
        const lx1 = cx - rx * 1.1 + (cx - rx * 0.2 - (cx - rx * 1.1)) * factor;
        const ly1 = cy - ry * 2.2 + (cy + ry * 1.15 - (cy - ry * 2.2)) * factor;
        ctx.beginPath(); ctx.moveTo(lx1 - rx * 0.06, ly1 + ry * 0.08); ctx.lineTo(lx1 + rx * 0.12, ly1 - ry * 0.05); ctx.stroke();

        const rx1 = cx + rx * 1.1 + (cx + rx * 0.2 - (cx + rx * 1.1)) * factor;
        const ry1 = cy - ry * 2.2 + (cy + ry * 1.15 - (cy - ry * 2.2)) * factor;
        ctx.beginPath(); ctx.moveTo(rx1 + rx * 0.06, ry1 + ry * 0.08); ctx.lineTo(rx1 - rx * 0.12, ry1 - ry * 0.05); ctx.stroke();
      }
      ctx.restore();

      // Calculate Tracking Iris Position
      const px = cx + look.x * rx * 0.35;
      const py = cy + look.y * ry * 0.35;

      // 3. Feathered Fiery Almond Eye Body
      function drawAlmondPath(context, scaleX = 1, scaleY = 1, timeOffset = 0) {
        const sx = rx * scaleX;
        const sy = ry * scaleY;
        context.beginPath();
        context.moveTo(cx - sx, cy);
        const wibble1 = Math.sin(t * 0.005 + timeOffset) * rx * 0.04;
        const wibble2 = Math.cos(t * 0.004 + timeOffset) * rx * 0.04;
        context.quadraticCurveTo(cx + wibble1, cy - sy * 1.25 + wibble2, cx + sx, cy);
        context.quadraticCurveTo(cx - wibble1, cy + sy * 1.25 - wibble2, cx - sx, cy);
        context.closePath();
      }

      ctx.save();

      // Soft feathered outer glow layers
      for (let l = 4; l >= 1; l--) {
        ctx.save();
        const sc = 1 + l * 0.06;
        drawAlmondPath(ctx, sc, sc, l);
        ctx.fillStyle = `rgba(180, 20, 0, ${0.12 / l})`;
        ctx.shadowColor = '#ff3300';
        ctx.shadowBlur = rx * 0.15 * l;
        ctx.fill();
        ctx.restore();
      }

      // Core Eye Base
      drawAlmondPath(ctx, 1, 1, 0);
      const bgGrad = ctx.createRadialGradient(px, py, ry * 0.05, px, py, rx * 1.1);
      bgGrad.addColorStop(0, '#ffffff');
      bgGrad.addColorStop(0.2, '#ffe055');
      bgGrad.addColorStop(0.5, '#ff5500');
      bgGrad.addColorStop(0.78, '#880c00');
      bgGrad.addColorStop(0.95, 'rgba(40, 5, 0, 0.85)');
      bgGrad.addColorStop(1, 'rgba(10, 1, 0, 0)');
      ctx.fillStyle = bgGrad;
      ctx.fill();
      ctx.clip();

      // 4. Radiant Light Tendrils
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 32; i++) {
        const ang = (i / 32) * Math.PI * 2 + Math.sin(t * 0.001 + i) * 0.05;
        const len = rx * (0.65 + Math.sin(i * 3 + t * 0.002) * 0.35);
        ctx.strokeStyle = i % 2 === 0 ? 'rgba(255,230,120,0.42)' : 'rgba(255,80,0,0.35)';
        ctx.lineWidth = rx * 0.025;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + Math.cos(ang) * len, py + Math.sin(ang) * (len * 0.62));
        ctx.stroke();
      }
      ctx.restore();

      // 5. Tracking Cat Slit Pupil
      const pW = (ry * 0.24 * pupil) * 0.5;
      const pH = (ry * 1.1) * 0.5;

      ctx.save();
      ctx.shadowColor = '#ffe600';
      ctx.shadowBlur = rx * 0.1;
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(px, py, pW, pH, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Fire Particles
      Fire.spawn(px, py, rx * 0.3, rx, (4 + 6 * intensity) | 0, intensity);
      Fire.draw(rx);

      // Curved Eyelid Blinking
      if (lid > 0) {
        ctx.fillStyle = '#050304';
        const topY = cy - ry * 1.35 + (ry * 1.35) * lid;
        const botY = cy + ry * 1.35 - (ry * 1.35) * lid;

        ctx.beginPath();
        ctx.moveTo(cx - rx - 10, cy);
        ctx.quadraticCurveTo(cx, cy - ry * 1.35, cx + rx + 10, cy);
        ctx.lineTo(cx + rx + 10, topY);
        ctx.quadraticCurveTo(cx, topY, cx - rx - 10, topY);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cx - rx - 10, cy);
        ctx.quadraticCurveTo(cx, cy + ry * 1.35, cx + rx + 10, cy);
        ctx.lineTo(cx + rx + 10, botY);
        ctx.quadraticCurveTo(cx, botY, cx - rx - 10, botY);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
      FireSound.setVolume(volEl.value, intensity);
    },
    deactivate() { Fire.clear(); Storm.clear(); FireSound.stop(); }
  };

  const STYLES = { inferno: InfernoStyle, eyes: EyesStyle };

  function loop(t) {
    requestAnimationFrame(loop);
    Motion.sample();
    const scene = Gaze.update(t);
    ctx.clearRect(0, 0, cv.width, cv.height);
    STYLES[style].draw(scene);
  }
  requestAnimationFrame(loop);
})();
</script>
